name: Deploy ML Service (Code)

concurrency:
  group: deploy-ml-code-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - 'ml_service/**'
      - 'requirements/ml.txt'
      - 'infrastructure/docker/ml_service.Dockerfile'
    paths-ignore:
      - 'ml_service/model_versions/**'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git pull origin main
            docker compose build risk-ml
            docker compose up -d --no-deps risk-ml
            echo "✅ ML Service (code) deployed"