server {
    listen 80;
    server_name cabg.insukuro.ru;

    # Внутренний DNS-сервер Docker (теперь строго внутри контекста server)
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Кэширование статических файлов фронтенда
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 1. Проксирование API запросов на основной Backend
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://risk-backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. ПРОПИСАНО ПРОКСИРОВАНИЕ НА АВТОНОМНЫЙ CALC-SERVICE
    location /calc/ {
        rewrite ^/calc/(.*) /$1 break;
        proxy_pass http://risk-calc:8005/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Проксирование системных путей FastAPI (health, docs бэкенда)
    location ~ ^/(health|docs|openapi.json) {
        proxy_pass http://risk-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/calc/(docs|openapi.json) {
    rewrite ^/calc/(.*) /$1 break;
    proxy_pass http://risk-calc:8005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Router - перенаправление всех путей на index.html
    location / {
        try_files $uri /index.html;
    }

    # Health check для самого Nginx
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}