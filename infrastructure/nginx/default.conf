server {
    listen 80;
    server_name cabg.insukuro.ru;

    # Внутренний DNS-сервер Docker
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Кэширование статических файлов только для основного фронтенда (React SPA)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 1. /api/calc/* → Calc Service (включая /api/calc/docs)
    # Используем ^~, чтобы правила статики React не перехватывали запросы
    location ^~ /api/calc/ {
        rewrite ^/api/calc/(.*) /$1 break;
        proxy_pass http://risk-calc:8005/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 2. /api/* → Backend (включая /api/docs, /api/openapi.json)
    location ^~ /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://risk-backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. /docs/* → Документация Docusaurus
    location ^~ /docs/ {
        proxy_pass http://risk-docs:80; # Проксируем на контейнер Docusaurus напрямую
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. /* → Основной фронтенд (React SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check для самого Nginx
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}